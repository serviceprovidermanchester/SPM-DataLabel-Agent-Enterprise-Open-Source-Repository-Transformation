services:
  datalabel:
    build:
      context: .
      dockerfile: Dockerfile
    image: spmanchester/datalabel:latest
    container_name: spm_datalabel_studio
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_PATH=/app/data/datalabel.sqlite
    volumes:
      - datalabel_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  datalabel_data:
    driver: local
